<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Pet Playground</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }
    body {
      overflow: hidden;
      background-color: #1a1a2e;
      color: #fff;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* --- TOP RIGHT BUTTONS --- */
    .top-right-controls {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 10;
      display: flex;
      gap: 10px;
    }

    .top-btn {
      background: rgba(20, 20, 35, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      padding: 10px 16px;
      border-radius: 30px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .top-btn:hover {
      background: rgba(40, 40, 65, 0.9);
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.4);
    }

    /* --- THEME POPUP MENU --- */
    .theme-popup {
      position: absolute;
      top: 70px;
      right: 20px;
      z-index: 10;
      background: rgba(20, 20, 35, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 12px;
      display: none;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    .theme-popup.active {
      display: flex;
    }
    .theme-option {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid transparent;
      color: #fff;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
      font-size: 0.85rem;
      transition: background 0.2s;
    }
    .theme-option:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* --- PET NOTE & CUSTOMIZER PANEL (LEFT) --- */
    .pet-card {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      background: rgba(20, 20, 35, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 18px;
      width: 300px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      display: none;
    }
    .pet-card.active {
      display: block;
    }
    .pet-card h3 {
      font-size: 1rem;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .close-btn {
      background: none;
      border: none;
      color: #aaa;
      cursor: pointer;
      font-size: 1.1rem;
    }
    .close-btn:hover {
      color: #fff;
    }
    
    .control-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    label {
      font-size: 0.85rem;
      color: #ddd;
    }
    input[type="color"] {
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      background: none;
    }

    input[type="text"], textarea {
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      color: white;
      padding: 8px 10px;
      margin-bottom: 10px;
      outline: none;
      font-size: 0.85rem;
    }
    textarea {
      height: 80px;
      resize: none;
    }

    .btn-group {
      display: flex;
      gap: 8px;
    }
    .btn-group button {
      flex: 1;
      padding: 8px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-save {
      background: #4f46e5;
      color: white;
    }
    .btn-save:hover {
      background: #6366f1;
    }
    .btn-delete {
      background: #e11d48;
      color: white;
    }
    .btn-delete:hover {
      background: #f43f5e;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="top-right-controls">
    <button class="top-btn" id="addPetBtn">➕ Add Pet</button>
    <button class="top-btn" id="themeToggleBtn">🎨 Color Scheme</button>
  </div>

  <div class="theme-popup" id="themePopup">
    <button class="theme-option" data-theme="midnight">🌌 Midnight Blue</button>
    <button class="theme-option" data-theme="sunset">🌅 Pastel Sunset</button>
    <button class="theme-option" data-theme="cyber">🌆 Cyberpunk</button>
    <button class="theme-option" data-theme="mint">🌿 Minty Fresh</button>
    <button class="theme-option" data-theme="clean">🤍 Clean White</button>
  </div>

  <div class="pet-card" id="petCard">
    <h3>
      <span>Pet Details</span>
      <button class="close-btn" id="closeCardBtn">✕</button>
    </h3>
    
    <div class="control-group">
      <label for="petColor">Pet Color:</label>
      <input type="color" id="petColor" value="#ff6b81">
    </div>

    <input type="text" id="noteTitle" placeholder="Pet Name / Title...">
    <textarea id="noteInput" placeholder="Add a note for this pet..."></textarea>
    
    <div class="btn-group">
      <button class="btn-save" id="saveNoteBtn">Save Note</button>
      <button class="btn-delete" id="deleteNoteBtn">Delete Pet</button>
    </div>
  </div>

  <script>
    // --- THEME DATA ---
    const themes = {
      midnight: { bg: 0x1a1a2e, floor: 0x16213e, light: 0xffffff },
      sunset:   { bg: 0xffd1dc, floor: 0xfbc4ab, light: 0xfff0e6 },
      cyber:    { bg: 0x0f051d, floor: 0x240046, light: 0x00ffff },
      mint:     { bg: 0xe8f5e9, floor: 0xc8e6c9, light: 0xffffff },
      clean:    { bg: 0xf8f9fa, floor: 0xe9ecef, light: 0xffffff }
    };

    // --- THREE.JS SETUP ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(themes.midnight.bg);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 9, 17);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.maxPolarAngle = Math.PI / 2 - 0.02; 
    controls.mouseButtons = { LEFT: null, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.ROTATE };

    // --- LIGHTS & FLOOR ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(10, 20, 10);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    scene.add(dirLight);

    const arenaSize = 24;
    const floorGeo = new THREE.PlaneGeometry(arenaSize, arenaSize);
    const floorMat = new THREE.MeshStandardMaterial({ color: themes.midnight.floor, roughness: 0.8 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const gridHelper = new THREE.GridHelper(arenaSize, 24, 0xffffff, 0xffffff);
    gridHelper.position.y = 0.01;
    gridHelper.material.opacity = 0.12;
    gridHelper.material.transparent = true;
    scene.add(gridHelper);

    // --- PARTICLE SYSTEM FOR POP EFFECT ---
    const activeParticles = [];

    function triggerPopEffect(position, colorHex) {
      const particleCount = 30;
      const geometry = new THREE.BufferGeometry();
      const positions = [];
      const velocities = [];

      for (let i = 0; i < particleCount; i++) {
        positions.push(position.x, position.y, position.z);
        
        // Random spherical explosion direction
        const speed = 0.08 + Math.random() * 0.12;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos((Math.random() * 2) - 1);

        velocities.push(
          speed * Math.sin(phi) * Math.cos(theta),
          speed * Math.sin(phi) * Math.sin(theta) + 0.05,
          speed * Math.cos(phi)
        );
      }

      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      
      const pMaterial = new THREE.PointsMaterial({
        color: colorHex,
        size: 0.22,
        transparent: true,
        opacity: 1,
        depthWrite: false
      });

      const pSystem = new THREE.Points(geometry, pMaterial);
      scene.add(pSystem);

      activeParticles.push({
        system: pSystem,
        velocities: velocities,
        life: 1.0 // 1s lifetime
      });
    }

    function updateParticles(delta) {
      for (let i = activeParticles.length - 1; i >= 0; i--) {
        const p = activeParticles[i];
        p.life -= delta * 1.8;

        if (p.life <= 0) {
          scene.remove(p.system);
          p.system.geometry.dispose();
          p.system.material.dispose();
          activeParticles.splice(i, 1);
          continue;
        }

        const positions = p.system.geometry.attributes.position.array;
        for (let j = 0; j < positions.length / 3; j++) {
          positions[j * 3]     += p.velocities[j * 3];
          positions[j * 3 + 1] += p.velocities[j * 3 + 1];
          positions[j * 3 + 2] += p.velocities[j * 3 + 2];
          
          p.velocities[j * 3 + 1] -= 0.003; // Slight gravity
        }
        
        p.system.geometry.attributes.position.needsUpdate = true;
        p.system.material.opacity = p.life;
      }
    }

    // --- PET CLASS & GENERATION ---
    let pets = [];
    let selectedPet = null;

    const blackMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
    const whiteMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

    class Pet {
      constructor(color = null) {
        this.group = new THREE.Group();
        this.color = color || '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');
        this.material = new THREE.MeshStandardMaterial({ color: this.color, roughness: 0.4 });
        
        this.title = "";
        this.note = "";

        // Completely Randomized Features
        this.scaleX = 0.7 + Math.random() * 0.5;
        this.scaleY = 0.7 + Math.random() * 0.5;
        this.scaleZ = 0.7 + Math.random() * 0.5;
        
        this.eyesGroup = new THREE.Group();
        this.happyEyesGroup = new THREE.Group();
        this.buildBody();

        // Title Label Sprite (hovering, facing camera)
        this.labelSprite = null;
        this.updateLabel();

        // Roaming state
        this.group.position.set((Math.random() - 0.5) * 14, 0, (Math.random() - 0.5) * 14);
        this.targetPos = this.group.position.clone();
        this.speed = 0.03 + Math.random() * 0.02;
        this.changeTargetTimer = 0;

        // Drag/Physics State
        this.isHeld = false;
        this.velocity = new THREE.Vector3();
        this.liftHeight = 1.8;

        // Animation States (Wiggle & Pop)
        this.isWiggling = false;
        this.wiggleTimer = 0;
        this.isPopping = false;
        this.popTimer = 0;

        scene.add(this.group);
        pets.push(this);
      }

      buildBody() {
        // Body Shape
        const shapes = ['sphere', 'box', 'cylinder'];
        const chosen = shapes[Math.floor(Math.random() * shapes.length)];
        let bodyGeo;
        if (chosen === 'sphere') bodyGeo = new THREE.SphereGeometry(1, 32, 32);
        else if (chosen === 'box') bodyGeo = new THREE.BoxGeometry(1.5, 1.5, 1.5);
        else bodyGeo = new THREE.CylinderGeometry(0.8, 0.8, 1.4, 32);

        this.bodyMesh = new THREE.Mesh(bodyGeo, this.material);
        this.bodyMesh.scale.set(this.scaleX, this.scaleY, this.scaleZ);
        this.bodyMesh.castShadow = true;
        this.group.add(this.bodyMesh);

        // --- NORMAL EYES ---
        this.group.add(this.eyesGroup);
        const eyeType = Math.floor(Math.random() * 3);
        const eyeSize = eyeType === 1 ? 0.22 : (eyeType === 2 ? 0.08 : 0.14);
        const leftEye = new THREE.Mesh(new THREE.SphereGeometry(eyeSize, 16, 16), eyeType === 2 ? blackMat : whiteMat);
        leftEye.position.set(-0.35 * this.scaleX, 0.2 * this.scaleY, 0.85 * this.scaleZ);
        this.eyesGroup.add(leftEye);

        const rightEye = leftEye.clone();
        rightEye.position.x = 0.35 * this.scaleX;
        this.eyesGroup.add(rightEye);

        if (eyeType !== 2) {
          const pupil = new THREE.Mesh(new THREE.SphereGeometry(eyeSize * 0.5, 16, 16), blackMat);
          pupil.position.set(-0.35 * this.scaleX, 0.2 * this.scaleY, 0.85 * this.scaleZ + eyeSize * 0.7);
          this.eyesGroup.add(pupil);

          const pupilR = pupil.clone();
          pupilR.position.x = 0.35 * this.scaleX;
          this.eyesGroup.add(pupilR);
        }

        // --- HAPPY CLOSED EYES (^ ^) ---
        this.group.add(this.happyEyesGroup);
        this.happyEyesGroup.visible = false;
        
        const happyEyeGeo = new THREE.TorusGeometry(0.12 * this.scaleX, 0.03, 8, 16, Math.PI);
        const happyEyeL = new THREE.Mesh(happyEyeGeo, blackMat);
        happyEyeL.position.set(-0.35 * this.scaleX, 0.2 * this.scaleY, 0.88 * this.scaleZ);
        happyEyeL.rotation.x = Math.PI;
        this.happyEyesGroup.add(happyEyeL);

        const happyEyeR = happyEyeL.clone();
        happyEyeR.position.x = 0.35 * this.scaleX;
        this.happyEyesGroup.add(happyEyeR);

        // Nose Type
        const noseGeo = new THREE.SphereGeometry(0.1, 16, 16);
        const nose = new THREE.Mesh(noseGeo, blackMat);
        nose.position.set(0, 0, 0.95 * this.scaleZ);
        this.group.add(nose);

        // Ear Type
        const earType = Math.floor(Math.random() * 3);
        let earGeo = earType === 0 ? new THREE.ConeGeometry(0.25, 0.6, 16) : new THREE.SphereGeometry(0.25, 16, 16);
        const leftEar = new THREE.Mesh(earGeo, this.material);
        leftEar.position.set(-0.5 * this.scaleX, 0.8 * this.scaleY, 0);
        leftEar.rotation.z = 0.3;
        leftEar.castShadow = true;
        this.group.add(leftEar);

        const rightEar = leftEar.clone();
        rightEar.position.x = 0.5 * this.scaleX;
        rightEar.rotation.z = -0.3;
        this.group.add(rightEar);

        // Tail Type
        const tailGeo = new THREE.CylinderGeometry(0.06, 0.04, 0.8, 16);
        const tail = new THREE.Mesh(tailGeo, this.material);
        tail.position.set(0, -0.1 * this.scaleY, -0.9 * this.scaleZ);
        tail.rotation.x = -Math.PI / 4;
        tail.castShadow = true;
        this.group.add(tail);

        this.group.position.y = this.scaleY;
      }

      updateLabel() {
        if (this.labelSprite) {
          this.group.remove(this.labelSprite);
          this.labelSprite.geometry.dispose();
          this.labelSprite.material.dispose();
          this.labelSprite = null;
        }

        if (!this.title.trim()) return;

        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 512;
        canvas.height = 128;

        ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.roundRect(16, 16, 480, 96, 24);
        ctx.fill();
        ctx.stroke();

        ctx.font = 'Bold 42px "Segoe UI", sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(this.title, 256, 64);

        const texture = new THREE.CanvasTexture(canvas);
        const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false });
        this.labelSprite = new THREE.Sprite(spriteMat);
        
        this.labelSprite.position.set(0, this.scaleY * 1.5 + 0.8, 0);
        this.labelSprite.scale.set(2.4, 0.6, 1);
        
        this.group.add(this.labelSprite);
      }

      setColor(hex) {
        this.color = hex;
        this.material.color.set(hex);
      }

      // Trigger Happy Edit Wiggle
      triggerWiggle() {
        this.isWiggling = true;
        this.wiggleTimer = 1.2; // 1.2 seconds of wiggling
        this.eyesGroup.visible = false;
        this.happyEyesGroup.visible = true;
      }

      // Trigger Pop & Removal
      pop() {
        this.isPopping = true;
        this.popTimer = 0.25; // Pop duration
      }

      destroy() {
        scene.remove(this.group);
      }

      update(delta) {
        // --- POP ANIMATION ---
        if (this.isPopping) {
          this.popTimer -= delta;
          const scaleProgress = Math.max(0, this.popTimer / 0.25);
          this.group.scale.setScalar(scaleProgress * 1.3); // Quick swell then shrink

          if (this.popTimer <= 0) {
            triggerPopEffect(this.group.position, this.color);
            this.destroy();
            pets = pets.filter(p => p !== this);
          }
          return;
        }

        // --- HAPPY WIGGLE ANIMATION ---
        if (this.isWiggling) {
          this.wiggleTimer -= delta;
          
          // Side-to-side rotation + rapid hop bounce
          this.group.rotation.z = Math.sin(this.wiggleTimer * 22) * 0.25;
          this.group.position.y = this.scaleY + Math.abs(Math.sin(this.wiggleTimer * 18)) * 0.4;

          if (this.wiggleTimer <= 0) {
            this.isWiggling = false;
            this.group.rotation.z = 0;
            this.eyesGroup.visible = true;
            this.happyEyesGroup.visible = false;
          }
          return;
        }

        if (this.isHeld) return; 

        // Bounce & Gravity physics
        if (this.group.position.y > this.scaleY || this.velocity.y !== 0) {
          this.velocity.y -= 9.8 * 0.0015;
          this.group.position.add(this.velocity);

          const limit = arenaSize / 2 - 1;
          this.group.position.x = Math.max(-limit, Math.min(limit, this.group.position.x));
          this.group.position.z = Math.max(-limit, Math.min(limit, this.group.position.z));

          if (this.group.position.y <= this.scaleY) {
            this.group.position.y = this.scaleY;
            this.velocity.set(0, 0, 0); 
          }
          return;
        }

        // Roaming
        this.changeTargetTimer -= delta;
        if (this.changeTargetTimer <= 0) {
          this.targetPos.set((Math.random() - 0.5) * (arenaSize - 4), this.scaleY, (Math.random() - 0.5) * (arenaSize - 4));
          this.changeTargetTimer = 4 + Math.random() * 5;
        }

        const dist = this.group.position.distanceTo(this.targetPos);
        if (dist > 0.2) {
          const dir = new THREE.Vector3().subVectors(this.targetPos, this.group.position).normalize();
          this.group.position.addScaledVector(dir, this.speed);
          
          const angle = Math.atan2(dir.x, dir.z);
          this.group.rotation.y = THREE.MathUtils.lerp(this.group.rotation.y, angle, 0.1);

          this.group.position.y = this.scaleY + Math.abs(Math.sin(Date.now() * 0.008)) * 0.15;
        } else {
          this.group.position.y = THREE.MathUtils.lerp(this.group.position.y, this.scaleY, 0.1);
        }
      }
    }

    // Spawn initial roaming pets immediately
    new Pet('#ff6b81');
    new Pet('#4ecdc4');

    // --- INTERACTION & DRAG/THROW PHYSICS ---
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const dragPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
    const planeIntersect = new THREE.Vector3();
    let previousMousePos = new THREE.Vector3();

    // Interaction distinction variables
    let pendingPet = null;
    let isDraggingPet = false;
    let startScreenPos = { x: 0, y: 0 };

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.top-right-controls') || e.target.closest('.pet-card') || e.target.closest('.theme-popup')) return;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      startScreenPos = { x: e.clientX, y: e.clientY };

      raycaster.setFromCamera(mouse, camera);

      const petMeshes = pets.map(p => p.group.children).flat();
      const intersects = raycaster.intersectObjects(petMeshes, true);

      if (intersects.length > 0) {
        let obj = intersects[0].object;
        while (obj.parent && !(obj.parent instanceof THREE.Scene) && !pets.find(p => p.group === obj)) {
          obj = obj.parent;
        }
        pendingPet = pets.find(p => p.group === obj);
        isDraggingPet = false;
      } else {
        pendingPet = null;
      }
    });

    window.addEventListener('pointermove', (e) => {
      if (!pendingPet) return;

      const distMoved = Math.hypot(e.clientX - startScreenPos.x, e.clientY - startScreenPos.y);

      if (distMoved > 5 && !isDraggingPet) {
        isDraggingPet = true;
        pendingPet.isHeld = true;

        dragPlane.constant = -(pendingPet.scaleY + pendingPet.liftHeight);
        
        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        raycaster.ray.intersectPlane(dragPlane, planeIntersect);
        previousMousePos.copy(planeIntersect);

        controls.enabled = false;
      }

      if (isDraggingPet) {
        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        if (raycaster.ray.intersectPlane(dragPlane, planeIntersect)) {
          pendingPet.group.position.x = planeIntersect.x;
          pendingPet.group.position.z = planeIntersect.z;
          pendingPet.group.position.y = pendingPet.scaleY + pendingPet.liftHeight;

          pendingPet.velocity.subVectors(planeIntersect, previousMousePos).multiplyScalar(0.2);
          previousMousePos.copy(planeIntersect);
        }
      }
    });

    window.addEventListener('pointerup', (e) => {
      if (e.target.closest('.top-right-controls') || e.target.closest('.pet-card') || e.target.closest('.theme-popup')) return;

      if (pendingPet) {
        if (isDraggingPet) {
          pendingPet.isHeld = false;
          pendingPet.velocity.y = 0.1;
        } else {
          selectPet(pendingPet);
        }
      } else {
        const distMoved = Math.hypot(e.clientX - startScreenPos.x, e.clientY - startScreenPos.y);
        if (distMoved <= 5) {
          selectPet(null);
        }
      }

      pendingPet = null;
      isDraggingPet = false;
      controls.enabled = true;
    });

    // --- UI EVENT HANDLING ---
    const addPetBtn = document.getElementById('addPetBtn');
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const themePopup = document.getElementById('themePopup');
    const petCard = document.getElementById('petCard');
    const closeCardBtn = document.getElementById('closeCardBtn');
    const petColorInput = document.getElementById('petColor');
    const noteTitle = document.getElementById('noteTitle');
    const noteInput = document.getElementById('noteInput');
    const saveNoteBtn = document.getElementById('saveNoteBtn');
    const deleteNoteBtn = document.getElementById('deleteNoteBtn');

    // Add Pet Button
    addPetBtn.addEventListener('click', () => {
      const newPet = new Pet();
      selectPet(newPet);
    });

    // Toggle Theme Menu
    themeToggleBtn.addEventListener('click', () => {
      themePopup.classList.toggle('active');
    });

    // Change Theme
    document.querySelectorAll('.theme-option').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const themeKey = e.target.getAttribute('data-theme');
        const t = themes[themeKey];
        scene.background.setHex(t.bg);
        floorMat.color.setHex(t.floor);
        dirLight.color.setHex(t.light);
        themePopup.classList.remove('active');
      });
    });

    // Pet Selection Handler
    function selectPet(pet) {
      selectedPet = pet;
      if (pet) {
        petColorInput.value = '#' + pet.material.color.getHexString();
        noteTitle.value = pet.title;
        noteInput.value = pet.note;
        petCard.classList.add('active');
      } else {
        petCard.classList.remove('active');
      }
    }

    closeCardBtn.addEventListener('click', () => selectPet(null));

    // Live Color Change
    petColorInput.addEventListener('input', (e) => {
      if (selectedPet) {
        selectedPet.setColor(e.target.value);
      }
    });

    // Save Note: Wiggle pet & close card automatically
    saveNoteBtn.addEventListener('click', () => {
      if (selectedPet) {
        selectedPet.title = noteTitle.value;
        selectedPet.note = noteInput.value;
        selectedPet.updateLabel();
        selectedPet.triggerWiggle();
        selectPet(null);
      }
    });

    // Delete Pet: Pop animation & particle burst
    deleteNoteBtn.addEventListener('click', () => {
      if (selectedPet) {
        selectedPet.pop();
        selectPet(null);
      }
    });

    // Window Resize Handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- ANIMATION LOOP ---
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      pets.forEach(pet => pet.update(delta));
      updateParticles(delta);

      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
