<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cursor test</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/style.css?t=now">
<style>
  body { font-family: system-ui, sans-serif; padding: 24px; max-width: 900px; margin: auto; }
  table { border-collapse: collapse; width: 100%; margin-bottom: 28px; }
  th, td { border: 1px solid #8884; padding: 6px 10px; text-align: left; font-size: 14px; }
  .ok { color: #1a9e4a; font-weight: 600; }
  .bad { color: #d33; font-weight: 600; }
  .hoverbox { display: inline-block; padding: 6px 14px; border: 1px dashed #8886; }
  code { font-size: 13px; }
</style>
</head>
<body>
<h1>Cursor test</h1>
<p>Part 1 checks each file loads from the server. Part 2 shows what your deployed <code>/style.css</code> applies. Hover the boxes to see the cursor.</p>

<h2>1. Files</h2>
<table id="files">
  <tr><th>File</th><th>HTTP status</th><th>Type</th><th>Bytes</th><th>Decoded size</th><th>Hover (raw file)</th></tr>
</table>

<h2>2. Deployed CSS</h2>
<table id="css">
  <tr><th>Element</th><th>Computed cursor</th></tr>
</table>
<p>Try these live: <textarea rows="2" cols="30">text box</textarea>
<input value="input"> <button>button</button> <a href="#">link</a></p>

<script>
var names = ['arrow','pointer','text-select','unavailable','busy','working-in-background',
  'handwriting','precision-select','move','horizontal-resize','vertical-resize',
  'diagonal-resize-1','diagonal-resize-2','alternate-select'];
var tb = document.getElementById('files');

names.forEach(function (n) {
  var url = '/images/cursor/' + n + '.cur?t=' + Date.now();
  var tr = document.createElement('tr');
  tr.innerHTML = '<td>' + n + '.cur</td><td class="s">…</td><td class="t">…</td><td class="b">…</td><td class="d">…</td><td><span class="hoverbox">hover me</span></td>';
  tb.appendChild(tr);
  tr.querySelector('.hoverbox').style.cursor = 'url("' + url + '"), crosshair';

  fetch(url, { cache: 'no-store' }).then(function (r) {
    var s = tr.querySelector('.s');
    s.textContent = r.status;
    s.className = 's ' + (r.ok ? 'ok' : 'bad');
    tr.querySelector('.t').textContent = r.headers.get('content-type') || '(none)';
    return r.arrayBuffer();
  }).then(function (buf) {
    tr.querySelector('.b').textContent = buf.byteLength;
  }).catch(function () {
    tr.querySelector('.s').textContent = 'failed';
    tr.querySelector('.s').className = 's bad';
  });

  var img = new Image();
  img.onload = function () {
    var d = tr.querySelector('.d');
    d.textContent = img.naturalWidth + ' x ' + img.naturalHeight;
    d.className = 'd ' + (img.naturalWidth <= 32 ? 'ok' : 'bad');
  };
  img.onerror = function () {
    var d = tr.querySelector('.d');
    d.textContent = 'cannot decode';
    d.className = 'd bad';
  };
  img.src = url;
});

window.addEventListener('load', function () {
  var ct = document.getElementById('css');
  var checks = [['body', document.body], ['textarea', document.querySelector('textarea')],
    ['input', document.querySelector('input')], ['button', document.querySelector('button')],
    ['a', document.querySelector('a')]];
  checks.forEach(function (c) {
    var tr = document.createElement('tr');
    var v = getComputedStyle(c[1]).cursor;
    tr.innerHTML = '<td>' + c[0] + '</td><td><code></code></td>';
    tr.querySelector('code').textContent = v;
    ct.appendChild(tr);
  });
});
</script>
</body>
</html>
